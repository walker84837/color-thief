[package]
name = "color-thief-ng"
version = "0.3.0"
edition = "2024"
authors = ["Reizner Evgeniy <razrfalcon@gmail.com>", "walker84837 <walker84837@gmail.com>"]
keywords = ["graphics", "color"]
categories = ["algorithms", "multimedia"]
description = "Grabs the dominant color or a representative color palette from an image."
repository = "https://github.com/walker84837/color-thief"
documentation = "https://docs.rs/color-thief-ng/"
readme = "README.md"
license = "MIT"
rust-version = "1.85.1"

[dependencies]
rand = "0.10.1"
rayon = "1.12"
rgb = "0.8"
thiserror = "2.0"

[dev-dependencies]
criterion = { version = "0.8", features = ["rayon"] }

[dev-dependencies.image]
version = "0.25"
default-features = false
features = ["jpeg", "png"]

[[bench]]
name = "find_palette"
harness = false
